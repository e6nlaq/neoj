name: Release

# Manual release pipeline:
#   1. verify every workspace package shares the version and is unpublished
#   2. compile the standalone binaries for the supported platforms
#   3. generate THIRD_PARTY_NOTICES.txt and package each binary with it and
#      the LICENSE file into a zip archive for the GitHub Release
#   4. drop each binary into its platform package (with the same notices),
#      and publish, in dependency order:
#      @neoj/cli-<platform> -> @neoj/api -> @neoj/cli
#   5. create a GitHub Release tagged `v<version>` with the zip archives and
#      their checksums attached
#
# Prerequisite: on npmjs.com, add a trusted publisher for each published package
# (`@neoj/cli`, `@neoj/api`, and the five `@neoj/cli-<platform>` packages)
# pointing at this repository, the workflow file `release.yml`, and no
# environment. Bump `version` in the root package.json and every
# `packages/*/package.json` on `main` before dispatching this workflow; the
# `package-versions.test.ts` test keeps them in lockstep.

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Build and verify everything without publishing or creating a release"
                required: false
                default: false
                type: boolean

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    verify:
        name: Verify release request
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Require the main branch
              if: ${{ !inputs.dry_run }}
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$REF_NAME" != "main" ]; then
                      echo "::error::Dispatch this workflow from main (selected: $REF_NAME)."
                      exit 1
                  fi

            - name: Validate the version
              id: version
              run: |
                  package_version="$(node -p "require('./package.json').version")"
                  if git ls-remote --tags origin "refs/tags/v$package_version" | grep -q .; then
                      echo "::error::Tag v$package_version already exists."
                      exit 1
                  fi

                  for manifest in package.json packages/*/package.json; do
                      version="$(node -p "require('./$manifest').version")"
                      name="$(node -p "require('./$manifest').name")"
                      if [ "$version" != "$package_version" ]; then
                          echo "::error::$name is $version, but the CLI is $package_version."
                          exit 1
                      fi
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "::error::$name@$version is already published on npm."
                          exit 1
                      fi
                  done

                  echo "version=$package_version" >> "$GITHUB_OUTPUT"
                  echo "Releasing $package_version."

    binaries:
        name: Build ${{ matrix.platform }} binary
        needs: verify
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: bun-linux-x64
                      platform: linux-x64
                      asset: linux-x64
                      os: ubuntu-latest
                      smoke: true
                    - target: bun-linux-arm64
                      platform: linux-arm64
                      asset: linux-arm64
                      os: ubuntu-latest
                    - target: bun-darwin-x64
                      platform: darwin-x64
                      asset: darwin-x64
                      os: macos-latest
                    - target: bun-darwin-arm64
                      platform: darwin-arm64
                      asset: darwin-arm64
                      os: macos-latest
                      smoke: true
                    - target: bun-windows-x64
                      platform: win32-x64
                      asset: windows-x64
                      os: ubuntu-latest
                      extension: ".exe"
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up tools with mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Compile
              run: |
                  mkdir -p "packages/cli-${{ matrix.platform }}"
                  bun build ./src/index.ts --compile --target="${{ matrix.target }}" \
                      --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
                      --no-compile-autoload-tsconfig --no-compile-autoload-package-json \
                      --format=esm --minify --bytecode \
                      --outfile "packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}"

            - name: Sign and verify the macOS binary
              if: ${{ matrix.os == 'macos-latest' }}
              run: |
                  binary="packages/cli-${{ matrix.platform }}/neoj"
                  # Bun ad-hoc signs host-architecture builds; sign cross-built
                  # binaries ourselves so they stay loadable on Apple Silicon.
                  if ! codesign -dv "$binary" 2>/dev/null; then
                      codesign --force --sign - "$binary"
                  fi
                  codesign -dv "$binary"

            - name: Generate the third-party notices
              run: bun run notices release/THIRD_PARTY_NOTICES.txt

            - name: Stage the release asset
              env:
                  VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  mkdir -p release
                  staging="$(mktemp -d)"
                  directory="$staging/neoj-$VERSION-${{ matrix.asset }}"
                  mkdir "$directory"
                  cp "packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}" \
                      "$directory/"
                  # Keep the executable bit so Linux/macOS users can run the
                  # binary straight after extracting the archive.
                  chmod 0755 "$directory/neoj${{ matrix.extension }}"
                  cp LICENSE THIRD_PARTY_NOTICES.txt "$directory/"
                  (
                      cd "$staging" &&
                      zip -q -r "$GITHUB_WORKSPACE/release/neoj-$VERSION-${{ matrix.asset }}.zip" \
                          "neoj-$VERSION-${{ matrix.asset }}"
                  )
                  unzip -l "release/neoj-$VERSION-${{ matrix.asset }}.zip"

            - name: Smoke test the binary
              if: ${{ matrix.smoke }}
              run: |
                  binary="packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}"
                  test -n "$("$binary" --version)"
                  workdir="$(mktemp -d)"
                  cd "$workdir"
                  "$GITHUB_WORKSPACE/$binary" init
                  test -f neoj.toml
                  test -f src/main.cpp
                  test -f template/main.cpp

            - name: Upload the binary
              uses: actions/upload-artifact@v7
              with:
                  name: cli-${{ matrix.platform }}
                  path: |
                      packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}
                      release/
                  if-no-files-found: error

    npm:
        name: Publish to npm
        needs: [verify, binaries]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up tools with mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true

            - name: Configure npm registry
              run: npm config set registry https://registry.npmjs.org/

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Download the binaries
              uses: actions/download-artifact@v8
              with:
                  pattern: cli-*
                  path: binaries
                  merge-multiple: true

            - name: Place the binaries in their platform packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  for directory in binaries/packages/*; do
                      platform="$(basename "$directory")"
                      test -f "$directory/neoj" || test -f "$directory/neoj.exe"
                      cp "$directory"/neoj* "packages/$platform/"
                  done

                  # upload-artifact stores the files without the executable bit,
                  # so restore it before npm packs the platform packages.
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
                      chmod 0755 "packages/cli-$platform/neoj"
                      test -x "packages/cli-$platform/neoj"
                  done
                  chmod 0755 packages/cli-win32-x64/neoj.exe

                  test -f packages/cli-win32-x64/neoj.exe
                  # The notices are generated once in the binaries job and
                  # uploaded inside the release/ artifact directory.
                  test -f binaries/release/THIRD_PARTY_NOTICES.txt
                  cp binaries/release/THIRD_PARTY_NOTICES.txt packages/cli-*/
                  cp binaries/release/THIRD_PARTY_NOTICES.txt .
                  for package in . packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-darwin-x64 packages/cli-darwin-arm64 packages/cli-win32-x64; do
                      test -f "$package/THIRD_PARTY_NOTICES.txt"
                  done
                  echo "Staged binaries for $version."

            - name: Build the API types
              run: bun run --filter @neoj/api build

            - name: Smoke test the published layout
              run: |
                  prefix="$(mktemp -d)"
                  pack="$(mktemp -d)"
                  platform_tarball="$(npm pack --silent --ignore-scripts --pack-destination "$pack" ./packages/cli-linux-x64)"
                  wrapper_tarball="$(npm pack --silent --ignore-scripts --pack-destination "$pack" .)"
                  tar -tzf "$pack/$platform_tarball" | grep -F "THIRD_PARTY_NOTICES.txt"
                  tar -tzf "$pack/$wrapper_tarball" | grep -F "THIRD_PARTY_NOTICES.txt"
                  echo '{ "name": "smoke", "private": true }' > "$prefix/package.json"
                  npm install --prefix "$prefix" --no-audit --no-fund \
                      "$pack/$platform_tarball" "$pack/$wrapper_tarball"
                  "$prefix/node_modules/.bin/neoj" --version

            - name: Publish the platform packages
              run: |
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
                      (cd "packages/cli-$platform" && npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }})
                  done

            - name: Publish @neoj/api
              working-directory: packages/api
              run: npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }}

            - name: Publish @neoj/cli
              run: npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }}

    release:
        name: Create GitHub Release
        needs: [verify, binaries, npm]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download the binaries
              uses: actions/download-artifact@v8
              with:
                  pattern: cli-*
                  path: binaries
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  mkdir -p assets
                  cp binaries/release/*.zip assets/
                  cd assets
                  ls -l
                  sha256sum neoj-*.zip > SHA256SUMS.txt

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  gh release create "v$VERSION" assets/* \
                      --title "v$VERSION" \
                      --target "$GITHUB_SHA" \
                      --generate-notes

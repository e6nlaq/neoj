name: Release

# Manual release pipeline:
#   1. verify every workspace package shares the version and is unpublished
#   2. compile the standalone binaries for the supported platforms, and
#      generate THIRD_PARTY_NOTICES.txt next to each of them
#   3. after every binary exists, package each one with the notices and the
#      LICENSE file into a zip archive for the GitHub Release (on Linux, so a
#      single archive command works for every platform)
#   4. drop each binary into its platform package (with the same notices),
#      and publish, in dependency order:
#      @neoj/cli-<platform> -> @neoj/api -> @neoj/cli
#   5. create a GitHub Release tagged `v<version>` with the zip archives and
#      their checksums attached
#
# Prerequisite: on npmjs.com, add a trusted publisher for each published package
# (`@neoj/cli`, `@neoj/api`, and the five `@neoj/cli-<platform>` packages)
# pointing at this repository, the workflow file `release.yml`, and no
# environment. Bump `version` in the root package.json and every
# `packages/*/package.json` on `main` before dispatching this workflow; the
# `package-versions.test.ts` test keeps them in lockstep.

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Build and verify everything without publishing or creating a release"
                required: false
                default: false
                type: boolean

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    verify:
        name: Verify release request
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Require the main branch
              if: ${{ !inputs.dry_run }}
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$REF_NAME" != "main" ]; then
                      echo "::error::Dispatch this workflow from main (selected: $REF_NAME)."
                      exit 1
                  fi

            - name: Validate the version
              id: version
              run: |
                  package_version="$(node -p "require('./package.json').version")"
                  if git ls-remote --tags origin "refs/tags/v$package_version" | grep -q .; then
                      echo "::error::Tag v$package_version already exists."
                      exit 1
                  fi

                  for manifest in package.json packages/*/package.json; do
                      version="$(node -p "require('./$manifest').version")"
                      name="$(node -p "require('./$manifest').name")"
                      if [ "$version" != "$package_version" ]; then
                          echo "::error::$name is $version, but the CLI is $package_version."
                          exit 1
                      fi
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "::error::$name@$version is already published on npm."
                          exit 1
                      fi
                  done

                  echo "version=$package_version" >> "$GITHUB_OUTPUT"
                  echo "Releasing $package_version."

    binaries:
        name: Build ${{ matrix.platform }} binary
        needs: verify
        runs-on: ${{ matrix.os }}
        # Windows runners default to PowerShell, but every step below is written
        # for the same POSIX shell (Git Bash ships with windows-latest).
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: bun-linux-x64
                      platform: linux-x64
                      os: ubuntu-latest
                      smoke: true
                    - target: bun-linux-arm64
                      platform: linux-arm64
                      os: ubuntu-latest
                    - target: bun-darwin-x64
                      platform: darwin-x64
                      os: macos-latest
                    - target: bun-darwin-arm64
                      platform: darwin-arm64
                      os: macos-latest
                      smoke: true
                    - target: bun-windows-x64
                      platform: win32-x64
                      os: windows-latest
                      extension: ".exe"
                      smoke: true
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up tools with mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Compile
              run: |
                  mkdir -p "packages/cli-${{ matrix.platform }}"
                  # The Windows PE resource flags are only valid for a Windows
                  # target; keep them in sync with the package metadata.
                  windows_flags=()
                  if [ "${{ matrix.extension }}" = ".exe" ]; then
                      windows_flags=(
                          --windows-title=neoj
                          --windows-publisher=e6nlaq
                          --windows-version="$VERSION.0"
                          --windows-description="A CLI for competitive programming workflows"
                          --windows-copyright="Copyright (c) 2026 e6nlaq"
                      )
                  fi
                  bun build ./src/index.ts --compile --target="${{ matrix.target }}" \
                      --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
                      --no-compile-autoload-tsconfig --no-compile-autoload-package-json \
                      --format=esm --minify --bytecode \
                      "${windows_flags[@]}" \
                      --outfile "packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}"
              env:
                  VERSION: ${{ needs.verify.outputs.version }}

            - name: Sign and verify the macOS binary
              if: ${{ matrix.os == 'macos-latest' }}
              run: |
                  binary="packages/cli-${{ matrix.platform }}/neoj"
                  # Bun ad-hoc signs host-architecture builds; sign cross-built
                  # binaries ourselves so they stay loadable on Apple Silicon.
                  if ! codesign -dv "$binary" 2>/dev/null; then
                      codesign --force --sign - "$binary"
                  fi
                  codesign -dv "$binary"

            - name: Generate the third-party notices
              run: bun run notices release/THIRD_PARTY_NOTICES.txt

            - name: Smoke test the binary
              if: ${{ matrix.smoke }}
              run: |
                  # Resolve the absolute path before moving out of the workspace
                  # so the same script works in Git Bash on Windows.
                  binary="$(pwd)/packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}"
                  test -n "$("$binary" --version)"
                  workdir="$(mktemp -d)"
                  cd "$workdir"
                  "$binary" init
                  test -f neoj.toml
                  test -f src/main.cpp
                  test -f template/main.cpp

            - name: Upload the binary
              uses: actions/upload-artifact@v7
              with:
                  name: cli-${{ matrix.platform }}
                  path: |
                      packages/cli-${{ matrix.platform }}/neoj${{ matrix.extension }}
                      release/THIRD_PARTY_NOTICES.txt
                  if-no-files-found: error

    assets:
        name: Package the release assets
        needs: [verify, binaries]
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Download the binaries
              uses: actions/download-artifact@v8
              with:
                  pattern: cli-*
                  path: binaries
                  merge-multiple: true

            - name: Create the archives
              env:
                  VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  # Every archive is built here, on Linux, because the runners do
                  # not share an archive tool: Windows has no `zip`, and the
                  # Windows/default PowerShell shell cannot run these commands.
                  notices="binaries/release/THIRD_PARTY_NOTICES.txt"
                  test -f "$notices"
                  mkdir -p release
                  staging="$(mktemp -d)"
                  count=0
                  for directory in binaries/packages/cli-*; do
                      test -d "$directory" || continue
                      # The download artifact keeps the package directory name
                      # (cli-<platform>); the archive uses the platform alone.
                      platform="$(basename "$directory")"
                      platform="${platform#cli-}"
                      # Package names use "win32", release assets "windows".
                      asset="${platform/win32/windows}"
                      name="neoj-$VERSION-$asset"
                      binary="$directory/neoj"
                      if [ -f "$directory/neoj.exe" ]; then
                          binary="$directory/neoj.exe"
                      else
                          # upload-artifact drops the executable bit, so restore
                          # it before packing: Linux/macOS users run the binary
                          # straight after extracting the archive.
                          chmod 0755 "$binary"
                          test -x "$binary"
                      fi
                      mkdir "$staging/$name"
                      cp "$binary" LICENSE "$notices" "$staging/$name/"
                      (
                          cd "$staging" &&
                          zip -q -r "$GITHUB_WORKSPACE/release/$name.zip" "$name"
                      )
                      unzip -l "release/$name.zip"
                      count=$((count + 1))
                  done
                  if [ "$count" -ne 5 ]; then
                      echo "::error::Expected 5 binaries to package, found $count."
                      exit 1
                  fi

            - name: Upload the archives
              uses: actions/upload-artifact@v7
              with:
                  name: release-assets
                  path: release/*.zip
                  if-no-files-found: error

    npm:
        name: Publish to npm
        needs: [verify, binaries]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up tools with mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true

            - name: Configure npm registry
              run: npm config set registry https://registry.npmjs.org/

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Download the binaries
              uses: actions/download-artifact@v8
              with:
                  pattern: cli-*
                  path: binaries
                  merge-multiple: true

            - name: Place the binaries in their platform packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  for directory in binaries/packages/*; do
                      platform="$(basename "$directory")"
                      test -f "$directory/neoj" || test -f "$directory/neoj.exe"
                      cp "$directory"/neoj* "packages/$platform/"
                  done

                  # upload-artifact stores the files without the executable bit,
                  # so restore it before npm packs the platform packages.
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
                      chmod 0755 "packages/cli-$platform/neoj"
                      test -x "packages/cli-$platform/neoj"
                  done
                  chmod 0755 packages/cli-win32-x64/neoj.exe

                  test -f packages/cli-win32-x64/neoj.exe
                  # The notices are generated once in the binaries job and
                  # uploaded inside the release/ artifact directory.
                  test -f binaries/release/THIRD_PARTY_NOTICES.txt
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
                      cp binaries/release/THIRD_PARTY_NOTICES.txt "packages/cli-$platform/"
                  done
                  cp binaries/release/THIRD_PARTY_NOTICES.txt .
                  for package in . packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-darwin-x64 packages/cli-darwin-arm64 packages/cli-win32-x64; do
                      test -f "$package/THIRD_PARTY_NOTICES.txt"
                  done
                  echo "Staged binaries for $version."

            - name: Build the API types
              run: bun run --filter @neoj/api build

            - name: Smoke test the published layout
              run: |
                  prefix="$(mktemp -d)"
                  pack="$(mktemp -d)"
                  platform_tarball="$(npm pack --silent --ignore-scripts --pack-destination "$pack" ./packages/cli-linux-x64)"
                  wrapper_tarball="$(npm pack --silent --ignore-scripts --pack-destination "$pack" .)"
                  tar -tzf "$pack/$platform_tarball" | grep -F "THIRD_PARTY_NOTICES.txt"
                  tar -tzf "$pack/$wrapper_tarball" | grep -F "THIRD_PARTY_NOTICES.txt"
                  echo '{ "name": "smoke", "private": true }' > "$prefix/package.json"
                  npm install --prefix "$prefix" --no-audit --no-fund \
                      "$pack/$platform_tarball" "$pack/$wrapper_tarball"
                  "$prefix/node_modules/.bin/neoj" --version

            - name: Publish the platform packages
              run: |
                  for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
                      (cd "packages/cli-$platform" && npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }})
                  done

            - name: Publish @neoj/api
              working-directory: packages/api
              run: npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }}

            - name: Publish @neoj/cli
              run: npm publish --ignore-scripts --provenance ${{ inputs.dry_run && '--dry-run' || '' }}

    release:
        name: Create GitHub Release
        needs: [verify, assets, npm]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download the archives
              uses: actions/download-artifact@v8
              with:
                  name: release-assets
                  path: assets

            - name: Generate checksums
              run: |
                  cd assets
                  # download-artifact writes the archive contents here; flatten a
                  # nested directory if one survives so the checksums list plain
                  # file names.
                  find . -mindepth 2 -name '*.zip' -exec mv -t . {} +
                  ls -l
                  sha256sum neoj-*.zip > SHA256SUMS.txt

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  gh release create "v$VERSION" assets/* \
                      --title "v$VERSION" \
                      --target "$GITHUB_SHA" \
                      --generate-notes

pre-commit:
    parallel: false
    commands:
        schema:
            glob: "{src/lib/util/config.ts,scripts/*.ts,schema/*.json}"
            run: bun run schema
            stage_fixed: true
        format:
            run: bun fmt --staged
        lint:
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
            run: bun run lint {staged_files}
        typecheck:
            glob: "*.{ts,tsx}"
            run: bun run typecheck

commit-msg:
    commands:
        commitlint:
            run: bunx commitlint --edit {1}

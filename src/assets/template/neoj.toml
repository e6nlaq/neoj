#:schema https://raw.githubusercontent.com/e6nlaq/neoj/main/schema/neoj.schema.json

# neoj config file
src = "src"

[testcase]
folder = "test"

[test]
source = "src/main.cpp"
cache = true

# Exponent of the floating-point tolerance accepted by `neoj test -e`:
# `-e` alone allows errors up to 10^-error, and `-e 9` overrides it to 1e-9.
# error = 6

# Interactive judging (`neoj test --interactive`) reads this section. The
# interactor and the solution run at the same time and talk over pipes.
# [test.interactor]
# source = "judge/interactor.cpp"
# run = ["{outfile}", "{infile}"]
# timeout = 15

# Special judge (`neoj test --judge`) reads this section. The solution's
# standard output arrives on the checker's standard input. Add {infile} to
# pass the test case path to the checker.
# [test.judge]
# source = "judge/checker.cpp"
# run = ["{outfile}", "{infile}"]
# timeout = 10

# Random test cases (`neoj generate`) run the generator with the case number
# as its first argument, and feed its output to the naive solution.
# [generate]
# gen = "judge/gen.cpp"
# naive = "judge/naive.cpp"

# Extra names for source files: `neoj test main` builds src/main.cpp.
# [alias]
# main = "src/main.cpp"

[languages.cpp]
source = "src/**/*.cpp"
compile = ["g++", "-std=c++23", "-O2", "-o", "{outfile}", "{source}"]
run = ["{outfile}"]
# Platform language IDs for `neoj submit`, keyed by platform name.
submit = { atcoder = "6017", yukicoder = "cpp23_gcc16" }
# Convert the source into the submitted text before submitting.
# presubmit = ["python", "tools/expand.py", "{source}", "{outfile}"]

[languages.python]
source = "**/*.py"
run = ["uv", "run", "{source}"]
submit = { atcoder = "6082", yukicoder = "python3" }

[submit]
confirm = true
wait = 3
open = true
clip = "never"
preview_lines = 5
presubmit_timeout = 30

[template]
enable = true
folder = "template"

[stash]
auto_stash = false
auto_apply = false

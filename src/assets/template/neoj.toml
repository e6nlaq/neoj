#:schema https://raw.githubusercontent.com/e6nlaq/neoj/main/schema/neoj.schema.json

# neoj config file
src = "src"

[testcase]
folder = "test"

[test]
source = "src/main.cpp"

[languages.cpp]
source = "src/**/*.cpp"
compile = ["g++", "-std=c++23", "-O2", "-o", "{outfile}", "{source}"]
run = ["{outfile}"]

[template]
enable = true
folder = "template"

[stash]
auto_stash = false
auto_apply = false
